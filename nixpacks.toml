# Railway / Nixpacks build config for the landing page.
#
# The landing page is served by serve.py using only the Python standard
# library, so we intentionally SKIP installing requirements.txt here — the
# report-generation deps (WeasyPrint, matplotlib) are not needed to serve a
# static page and would only slow the deploy and pull in system libraries.
#
# The CLI report tool is run locally (see README), not on Railway.

providers = ["python"]

[phases.install]
cmds = ["echo 'no install needed — stdlib-only static server'"]

[start]
cmd = "python serve.py"
